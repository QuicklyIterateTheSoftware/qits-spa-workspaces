<header class="head">
  <div>
    <h1>Workspaces</h1>
    <p class="lede">{{ summary() }}</p>
  </div>
  <qits-button variant="secondary" size="sm" (pressed)="load()">Refresh</qits-button>
</header>

<app-async
  [state]="projects()"
  loadingLabel="Loading projects"
  errorLabel="Could not load the projects"
  (retry)="load()"
/>

@for (read of projectReads(); track read.projectId) {
  <app-async
    [state]="read.state"
    loadingLabel="Loading repositories"
    [errorLabel]="'Could not load the repositories in ' + read.projectName"
    (retry)="loadRepositories(read.projectId)"
  />
}

@for (node of roots(); track node.repository.id) {
  <app-repository-node
    [node]="node"
    (retryWorkspaces)="loadWorkspaces(node.repository.id)"
    (retryBranches)="loadBranches(node.repository.id)"
    (create)="createWorkspace(node.repository, $event)"
  />
}

@if (projects().kind === 'ready' && projectReads().length === 0 && roots().length === 0) {
  <app-empty message="No repositories on this platform yet." />
}
