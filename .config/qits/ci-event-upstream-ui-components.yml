# The release train, seen from a consumer that has not joined it yet. This repository consumes
# @qits/ui-components, so it declares an interest in that library's releases and runs a pipeline of
# its own when one lands.
#
# The trigger type is the second one qits-ci has. A push runs .config/qits/ci-post-receive.yml at the
# pushed commit; this file runs when a domain event on the platform's bus matches the selection below,
# against the head of main. Both are ordinary pipelines and neither knows about the other.
#
# THIS STEP IS A DEMONSTRATION AND SAYS SO. It prints the four QITS_EVENT_* variables an
# event-triggered container receives and the payload's own fields, and nothing else — no install, no
# build, no commit. The real hop is the version bump: read the released version out of the event,
# write it into package.json, run the install, and force-push the result as
# maintenance/qits-spa-ui-components, so that a library release walks into every consumer without a
# person carrying it. qits-spa-home carries that step today and this repository is a fan-out away
# from it, waiting on the user's go rather than on anything missing.
#
# IT USED TO SELECT BuildSuccessful, AND THAT WAS THE WRONG EVENT TWICE OVER. BuildSuccessful says a
# build passed: it carries no version, so a bump written against it would be guessing, and it fires
# for every green push — this file woke three times in one day for builds that were not releases and
# did nothing each time. SoftwareRelease is the event a consumer can act on: qits-ci publishes it
# when a repository's release pipeline goes green, once per declared artifact, and its payload is
# {repository, version, packageType, packageName}. It means the tarball is in the registry.
#
# THERE IS DELIBERATELY NO BRANCH CONDITION, and this is the line that changed shape most. The old
# selection AND'd `branch: { exact: main }` onto the repo id, which was right for BuildSuccessful.
# SoftwareRelease carries no branch at all, so that condition would now match nothing, ever.
# `repository` is the whole selection, and it holds the repo id string, the identity every other
# contract on this platform carries. Note the field renamed too: BuildSuccessful spells it `repoId`.
#
# jq is what the platform's docs assume a step reaches for, and node-base does not carry it (measured:
# `jq: not found`). node does, and it parses JSON, so the fields below go through `node -p`. Either is
# fine — the payload arrives as one verbatim string and reading it is the step's business.
#
# THE LOOP FOOTGUN, because this is the file where it bites: a `when:` that matches an event this
# repository's OWN pipelines publish is an unbounded build loop. This repo has no release pipeline,
# so it publishes no SoftwareRelease today — but the selection below is `exact` on
# qits-spa-ui-components rather than relying on that. Widen it to a prefix like `qits-spa-` and the
# day this repo gains one, this file triggers a run that releases this repo that publishes the event
# that triggers this file, forever — each hop is a new event id, so qits-ci's at-most-once dedupe
# never engages. It stops replays, not descendants. Review is the only guard today; see qits-ci's
# README.
event: SoftwareRelease
when:
  - repository: { exact: qits-spa-ui-components }
steps:
  - image: qits/build-images/node-base:latest
    timeout-seconds: 300
    script: |
      # The daemon runs this with `bash -c` and no -e. -u is the load-bearing half here: the whole
      # point of this step is that the four variables are set, so an unset one must stop it rather
      # than print an empty line that reads like a pass.
      set -eu

      echo "Triggered by event $QITS_EVENT_NAME"
      echo "  QITS_EVENT_ID:          $QITS_EVENT_ID"
      echo "  QITS_EVENT_NAME:        $QITS_EVENT_NAME"
      echo "  QITS_EVENT_OCCURRED_AT: $QITS_EVENT_OCCURRED_AT"
      echo "  QITS_EVENT_PAYLOAD:     $QITS_EVENT_PAYLOAD"

      # And the same payload read as data rather than echoed, which is what a real step does with it.
      # The version is the field the bump exists for; the package name and type are what say WHICH
      # artifact of the upstream this is, since a repository publishing several emits one event each.
      echo "  upstream repo:          $(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).repository')"
      echo "  released version:       $(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')"
      echo "  package:                $(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).packageName')"
      echo "  package type:           $(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).packageType')"
